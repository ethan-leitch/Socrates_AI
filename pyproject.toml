[project]
name = "socrates-ai"
version = "0.1.0"
description = "A from-scratch language model trained on public-domain philosophy texts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy<2",
    "pandas>=2.2,<3",
    "matplotlib>=3.11.1",
    "seaborn>=0.13.2",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "gutenbergpy>=0.3.5",
    "requests>=2.34.2",
    "datasets>=5.0.0",
    "torch==2.2.2",
    "torchvision==0.17.2",
    "torchaudio==2.2.2",
    "transformers>=5.14.1",
    "tokenizers>=0.22.2",
    "tiktoken>=0.13.0",
    "jupyter>=1.1.1",
    "visualtorch>=1.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["socrates_ai"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.16.0",
]
